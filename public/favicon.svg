<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1b6b"/>
      <stop offset="100%" stop-color="#0d0a2e"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#ffffff24" stroke-width="2"/>
  <!-- Two intersecting lines forming vertically opposite angles -->
  <line x1="12" y1="12" x2="52" y2="52" stroke="url(#goldLine)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="52" y1="12" x2="12" y2="52" stroke="url(#cyanLine)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Angle arcs -->
  <path d="M 32 24 A 8 8 0 0 1 38 32" stroke="#facc15" stroke-width="2" fill="none" opacity="0.9"/>
  <path d="M 32 40 A 8 8 0 0 1 26 32" stroke="#facc15" stroke-width="2" fill="none" opacity="0.9"/>
  <!-- Center Vertex O -->
  <circle cx="32" cy="32" r="4.5" fill="#facc15" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
</svg>
